# 금융자산 포트폴리오 초기 시드.
#
# 운영 소스가 아니다. 여기 있는 값은 첫 실행에서 빈 DB를 채우기 위한 출발점일
# 뿐이고, 이후 수정은 전부 Django admin에서 한다 - 검색 조건에 대해
# `properties/seed/searches.yaml`이 그런 것과 같다.
#
# 출처:
#   - 계좌 별칭과 자산분류: stock_management/test/data/my_etf_list.csv
#   - 국민연금 기준 비중: stock_management/test/data/국민연금 포트폴리오.xlsx (Sheet1!A1:B6)
#
# 보유수량·매입금액은 옮기지 않는다. 그 숫자는 H-able에서 수집한 것이 진짜이고,
# 오래된 사본을 Git에 남길 이유가 없다.

asset_classes:
  - id: korea-stock
    name: 한국 주식
    benchmark_category: domestic_stock
    display_order: 10
  - id: us-stock
    name: 미국 주식
    benchmark_category: foreign_stock
    display_order: 20
  - id: other-stock
    name: 기타 주식
    benchmark_category: foreign_stock
    display_order: 30
  - id: bond
    name: 채권
    benchmark_category: bond
    display_order: 40
  - id: gold
    name: 금
    benchmark_category: alternative
    display_order: 50
  - id: crypto
    name: 코인
    benchmark_category: alternative
    display_order: 60
  # 예수금과 현금성 자산의 초기 자리. 국민연금 공통분류로는 채권으로 본다.
  - id: safe-asset
    name: 안전자산
    benchmark_category: bond
    display_order: 70
  # 처음 보는 종목이 들어오는 곳. 공통분류가 비어 있어 국민연금 비교에서 빠지고,
  # 화면에는 제외 금액으로 표시된다.
  - id: unclassified
    name: 미분류
    benchmark_category: ""
    display_order: 999

# KB증권 계좌는 수집기가 채운다. 마스킹 계좌번호도 수집기가 실제 값으로 넣는다.
# 코인 지갑만 예외다 - [1285]에 나오지 않으므로 수량을 사람이 admin에 넣는다.
accounts:
  - id: kb-brokerage
    alias: 종합위탁
    account_type: brokerage
  - id: kb-isa
    alias: ISA
    account_type: isa
  - id: kb-pension-1
    alias: 개인연금
    account_type: pension
  - id: kb-pension-2
    alias: 개인연금2
    account_type: pension
  - id: kb-retirement
    alias: 퇴직연금
    account_type: retirement
  # 코인 지갑. `required: false`인 이유는 두 가지다. 하나는 시세를 못 받은 날
  # 주식 쪽 성과까지 통째로 사라지면 안 되기 때문이고, 다른 하나는 이 계좌가
  # 생기기 전의 과거 날짜가 전부 불완전으로 바뀌어 성과 이력이 지워지기
  # 때문이다. 시세를 못 받은 날은 리포트의 계좌 상태에 `missing`으로 뜬다.
  - id: coin-wallet
    institution: 코인 지갑
    alias: 코인
    account_type: brokerage
    required: false

# 원본 합계는 99.8%다. 그대로 보존하고 비교 차트에서만 100%로 정규화한다.
benchmark:
  as_of: 2026-09-05
  source: "국민연금 포트폴리오.xlsx Sheet1!A1:B6"
  rows:
    - source_category: 국내주식
      benchmark_category: domestic_stock
      source_percent: 12.7
    - source_category: 국내채권
      benchmark_category: bond
      source_percent: 27.7
    - source_category: 해외주식
      benchmark_category: foreign_stock
      source_percent: 35.0
    - source_category: 해외채권
      benchmark_category: bond
      source_percent: 7.4
    - source_category: 대체투자
      benchmark_category: alternative
      source_percent: 17.0

# 수집기가 만든 종목은 종목코드만 알고 분류는 모른다. 이름이 여기 있으면
# 시드를 다시 돌릴 때 해당 분류로 옮겨준다. 여기 없는 종목은 미분류로 남고
# admin에서 직접 정한다 - 이름만 보고 추측하지 않는다.
instrument_names:
  korea-stock: [삼성전자, 현대차, 현대차2우B, 기업은행, LG디스플레이, 아모레퍼시픽]
  us-stock:
    - KODEX 미국나스닥100(H)
    - SOL 미국배당다우존스(H)
    - RISE 미국S&P500(H)
  other-stock:
    - KIWOOM 인도Nifty50(합성)
    - RISE 유로스탁스50(H)
  bond:
    - KIWOOM 국고채10년
    - KODEX 미국30년국채액티브(H)
    - KODEX CD금리액티브(합성)
  gold: [ACE KRX금현물]
  crypto: [비트코인, 이더리움]

# 수집기가 닿지 않는 종목의 자리. 여기 있는 종목은 admin의 `직접 입력 보유`에
# 수량만 넣으면 매일 `update_manual_positions`가 `price_source`의 시세를 붙여
# 스냅샷을 만든다. 목록에 없는 코인은 admin에서 종목을 하나 추가하고
# 시세 출처에 `upbit:KRW-<심볼>`만 적으면 된다 - 업비트 KRW 마켓이면 다 된다.
#
# 이미 있는 종목은 건드리지 않는다. 시세 출처가 비어 있을 때만 채운다.
instruments:
  - code: KRW-BTC
    name: 비트코인
    asset_class: crypto
    price_source: upbit:KRW-BTC
  - code: KRW-ETH
    name: 이더리움
    asset_class: crypto
    price_source: upbit:KRW-ETH
