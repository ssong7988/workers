<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}금융자산{% endblock %}</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7f6; color: #0f172a; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  a { color: inherit; text-decoration: none; }
  .header { background: #0b2545; color: #fff; }
  .header-inner { max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem; }
  @media (min-width: 640px) { .header-inner { padding: 2.75rem 2rem; } }
  .eyebrow { display: flex; align-items: center; gap: .5rem; font-size: .875rem; font-weight: 600; color: #bae6fd; }
  .title { margin: .75rem 0 0; font-size: 1.875rem; font-weight: 700; letter-spacing: -0.01em; }
  @media (min-width: 640px) { .title { font-size: 2.25rem; } }
  .observed { margin-top: .75rem; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; font-size: .875rem; color: rgba(219, 234, 254, .75); }
  .tabs { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: .5rem; }
  .tab { border: 1px solid rgba(186, 230, 253, .4); border-radius: 999px; padding: .35rem .9rem; font-size: .8125rem; font-weight: 600; color: #bae6fd; }
  .tab:hover { background: rgba(186, 230, 253, .12); }
  .tab.current { background: #bae6fd; border-color: #bae6fd; color: #0b2545; }
  .body { max-width: 56rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
  @media (min-width: 640px) { .body { padding: 2rem 2rem; } }
  .panel { border-radius: 1rem; border: 1px solid #e2e8f0; background: #fff; padding: 1.25rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  @media (min-width: 640px) { .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .body > *, .summary > *, .panel > * { min-width: 0; }
  .tile-value { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  svg { max-width: 100%; }
  .icon { flex-shrink: 0; }
  @media (max-width: 639px) {
    .header-inner { padding: 1.5rem 1rem; }
    .body .panel { padding: .9rem; }
    .summary .tile { padding: .85rem .5rem; }
    .table-wrap table { min-width: 0; }
    .table-wrap thead { display: none; }
    .table-wrap tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: .7rem; gap: .6rem; }
    .table-wrap tr + tr { border-top: 1px solid #e2e8f0; }
    .table-wrap td { display: block; border: 0; padding: 0; white-space: normal; text-align: left; overflow-wrap: anywhere; }
    .table-wrap td::before { content: attr(data-label); display: block; color: #64748b; font-size: .7rem; font-weight: 400; margin-bottom: .2rem; }
    .table-wrap td:first-child { grid-column: 1 / -1; font-weight: 700; }
  }
  .tile { border-radius: 1rem; border: 1px solid #e2e8f0; background: #fff; padding: 1rem; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .tile-value { font-size: 1.25rem; font-weight: 800; }
  @media (min-width: 640px) { .tile-value { font-size: 1.5rem; } }
  .tile-label { margin-top: .25rem; font-size: 11px; font-weight: 600; color: #64748b; }
  .tile-up { color: #b91c1c; }
  .tile-down { color: #1d4ed8; }
  .section-title { margin-top: 1.75rem; display: flex; align-items: center; gap: .5rem; padding: 0 .25rem; font-size: 1.125rem; font-weight: 700; }
  .notice { margin-top: .75rem; border-radius: .5rem; border: 1px solid #fde68a; background: #fffbeb; padding: .6rem .75rem; font-size: 12px; color: #92400e; }
  .hint { margin-top: .5rem; font-size: 12px; color: #64748b; line-height: 1.6; }
  .table-wrap { margin-top: 1rem; overflow-x: auto; border-radius: 1rem; border: 1px solid #e2e8f0; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  table { border-collapse: collapse; width: 100%; min-width: 30rem; font-size: .875rem; }
  th, td { padding: .6rem .75rem; text-align: right; border-top: 1px solid #f1f5f9; white-space: nowrap; }
  th { background: #f8fafc; font-size: 12px; color: #475569; border-top: none; }
  th:first-child, td:first-child { text-align: left; }
  .buy { color: #b91c1c; font-weight: 700; }
  .sell { color: #1d4ed8; font-weight: 700; }
  .none { color: #cbd5e1; }
  .swatch { display: inline-block; width: .7rem; height: .7rem; border-radius: 3px; vertical-align: -1px; margin-right: .4rem; }
  .empty { padding: 3rem 1rem; text-align: center; color: #64748b; }
  .footer { padding: 1.75rem .5rem; text-align: center; font-size: 12px; line-height: 1.5; color: #94a3b8; }
  .icon { display: inline-block; vertical-align: -3px; }
{% block extra_style %}{% endblock %}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
  <div class="eyebrow">
    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>
    KB증권 금융자산
  </div>
  <h1 class="title">{% block heading %}{% endblock %}</h1>
  <div class="observed">
    <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
    {% block observed %}{% endblock %}
  </div>
  <nav class="tabs">
    <a class="tab{% if page == 'allocation' %} current{% endif %}" href="{{ allocation_url }}">비중 · 리밸런싱</a>
    <a class="tab{% if page == 'performance' %} current{% endif %}" href="{{ performance_url }}">수익률 · MDD</a>
  </nav>
</div></header>

<div class="body">
{% block content %}{% endblock %}
</div>

<footer class="footer">
  금융자산만 집계합니다. 부동산 평가액은 포함하지 않습니다.<br>
  리밸런싱 금액은 자산분류 단위의 참고값이며 주문을 실행하지 않습니다.
</footer>
</body>
</html>
